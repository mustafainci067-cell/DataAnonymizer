name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: anonymizer_sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Seed PostgreSQL sandbox schema
        env:
          PGPASSWORD: password
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql -h 127.0.0.1 -p 5432 -U admin -d anonymizer_sandbox -f init.sql

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        env:
          TEST_POSTGRES_DSN: "postgres://admin:password@localhost:5432/anonymizer_sandbox?sslmode=disable"
        run: go test -race -v ./...

      - name: Build binary
        run: go build -v ./...
